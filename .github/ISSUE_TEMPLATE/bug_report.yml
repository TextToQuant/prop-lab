name: Bug report
description: Something is wrong or produces a misleading number
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. The most useful bug reports in this project
        have come with the command that produced the wrong output and the
        number it printed.

  - type: textarea
    id: command
    attributes:
      label: What did you run?
      description: The exact command, including the flags.
      placeholder: proplab report --strategy my_strategy.py:MyStrategy --data data/BTCUSDT_15m.csv --firm apex-50k-eod
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What should it have printed instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the output. Include the full warning list if there is one.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: prop-lab version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.4
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Data source and range
      description: Which adapter, which symbol, which date range, how many bars.
      placeholder: binance BTCUSDT 15m, 2023-01-01 to 2026-11-03, 134675 bars
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Please confirm
      options:
        - label: I read the honesty rules and I believe this is a real defect, not a surprising-but-correct result.
          required: false
        - label: I ran the test suite and it passes on my machine.
          required: false
