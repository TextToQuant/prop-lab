[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prop-lab"
version = "0.1.0"
description = "Agent-driven prop firm challenge lab: backtest any strategy, walk-forward OOS, honest bootstrap Monte Carlo pass-rate surfaces"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "prop-lab contributors" }]
keywords = [
    "trading",
    "backtesting",
    "monte-carlo",
    "prop-firm",
    "prop-trading",
    "walk-forward",
    "bootstrap",
    "pass-rate",
    "risk-management",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    # The market-data adapters are part of the package's core function,
    # not an optional extra: the Yahoo adapter is imported by the
    # regression tests and the Binance and Dukascopy adapters need
    # requests. Leaving these out of the core dependencies meant a
    # clean `pip install -e .` produced an environment where importing
    # the data layer raised ModuleNotFoundError.
    "yfinance>=0.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    # tomllib is stdlib from 3.11. The docs-vs-code test parses
    # pyproject.toml, and requires-python says >=3.10, so 3.10 needs the
    # backport or that test cannot run at all.
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/<owner>/prop-lab"
Repository = "https://github.com/<owner>/prop-lab"
Issues = "https://github.com/<owner>/prop-lab/issues"
Changelog = "https://github.com/<owner>/prop-lab/blob/master/CHANGELOG.md"

[project.scripts]
proplab = "prop_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the network (set PROPLAB_NETWORK_TESTS=1)"]
filterwarnings = ["ignore::DeprecationWarning"]
